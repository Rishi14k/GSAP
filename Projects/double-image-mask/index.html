<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Mask Effect</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        overflow: hidden;
      }

      .normal,
      .masked {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .masked {
        pointer-events: none;

        mask-image: url(circle.png);
        -webkit-mask-image: url(circle.png);

        mask-size: var(--mask-size, 20px);
        -webkit-mask-size: var(--mask-size, 20px);

        mask-repeat: no-repeat;
        -webkit-mask-repeat: no-repeat;

        mask-position: var(--mask-x, -100px) var(--mask-y, -100px);
        -webkit-mask-position: var(--mask-x, -100px) var(--mask-y, -100px);

        background: #ddfc3e;
      }

      img {
        width: 450px;
        height: 700px;
        object-fit: cover;
        border-radius: 15px;
      }
    </style>
  </head>

  <body>
 <body>
  <div class="normal">
    <img id="hoverTarget" src="./images/download (2).jfif" />
  </div>

  <div class="masked">
    <img src="./images/download (3).jfif" />
  </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

    <script>
      const mask = document.querySelector(".masked");
      const hoverTarget = document.querySelector("#hoverTarget");

      const maskSizeSmall = 20;
      const maskSizeLarge = 250;
      let currentSize = maskSizeSmall;

      document.addEventListener("mousemove", (e) => {
        const half = currentSize / 2;

        gsap.to(mask, {
          "--mask-x": `${e.clientX - half}px`,
          "--mask-y": `${e.clientY - half}px`,
          duration: 0.45,
          ease: "power2.out",
        });
      });

      hoverTarget.addEventListener("mouseenter", () => {
        currentSize = maskSizeLarge;
        gsap.to(mask, {
          "--mask-size": `${maskSizeLarge}px`,
          duration: 0.35,
          ease: "power3.out",
        });
      });

      hoverTarget.addEventListener("mouseleave", () => {
        currentSize = maskSizeSmall;
        gsap.to(mask, {
          "--mask-size": `${maskSizeSmall}px`,
          duration: 0.35,
          ease: "power3.out",
        });
      });
    </script>
  </body>
</html>
